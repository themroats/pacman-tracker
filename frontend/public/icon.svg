<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="#1a1a2e" stroke="#16213e" stroke-width="8"/>

  <!-- Street grid (map lines) -->
  <g stroke="#2a2a4a" stroke-width="6" stroke-linecap="round">
    <!-- Horizontal streets -->
    <line x1="60" y1="160" x2="452" y2="160"/>
    <line x1="80" y1="256" x2="440" y2="256"/>
    <line x1="60" y1="352" x2="452" y2="352"/>
    <!-- Vertical streets -->
    <line x1="160" y1="60" x2="160" y2="452"/>
    <line x1="256" y1="80" x2="256" y2="440"/>
    <line x1="352" y1="60" x2="352" y2="452"/>
  </g>

  <!-- Covered streets (bright) -->
  <g stroke="#4cc9f0" stroke-width="6" stroke-linecap="round" opacity="0.8">
    <line x1="60" y1="160" x2="256" y2="160"/>
    <line x1="160" y1="60" x2="160" y2="256"/>
    <line x1="80" y1="256" x2="256" y2="256"/>
    <line x1="256" y1="160" x2="256" y2="256"/>
  </g>

  <!-- Uncovered street dots -->
  <g fill="#2a2a4a">
    <circle cx="310" cy="160" r="5"/>
    <circle cx="352" cy="160" r="5"/>
    <circle cx="400" cy="160" r="5"/>
    <circle cx="352" cy="200" r="5"/>
    <circle cx="352" cy="256" r="5"/>
    <circle cx="310" cy="256" r="5"/>
    <circle cx="400" cy="256" r="5"/>
    <circle cx="160" cy="310" r="5"/>
    <circle cx="160" cy="352" r="5"/>
    <circle cx="256" cy="310" r="5"/>
    <circle cx="256" cy="352" r="5"/>
    <circle cx="200" cy="352" r="5"/>
    <circle cx="310" cy="352" r="5"/>
    <circle cx="352" cy="352" r="5"/>
    <circle cx="400" cy="352" r="5"/>
    <circle cx="352" cy="310" r="5"/>
  </g>

  <!-- Pac-Man character -->
  <g transform="translate(240, 240)">
    <!-- Body -->
    <path d="M 0,0 L 40,-30 A 50,50 0 1,0 40,30 Z" fill="#ffd60a" transform="translate(-15, -5)"/>
    <!-- Eye -->
    <circle cx="5" cy="-22" r="6" fill="#1a1a2e"/>
  </g>
</svg>
