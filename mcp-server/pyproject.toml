[project]
name = "pacman-mcp"
version = "0.1.0"
description = "MCP server for Pacman street coverage tracker"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.26.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pacman_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
